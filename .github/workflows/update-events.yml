name: イベントを更新

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: events-json
  cancel-in-progress: false

jobs:
  apply:
    name: events.json を反映
    if: >-
      github.event.issue.user.login == 'koenma777'
      && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'event')
      && (github.event.action != 'labeled' || github.event.label.name == 'event')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate and update events.json
        id: apply
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-event.mjs --events events.json --comment "$RUNNER_TEMP/comment.md" --result "$RUNNER_TEMP/result.json" --commit-message "$RUNNER_TEMP/commit-message.txt"

      - name: Commit and push
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- events.json
          if git diff --cached --quiet -- events.json; then
            echo "events.json had no changes"
          else
            git commit -F "$RUNNER_TEMP/commit-message.txt"
            git push origin HEAD:main
          fi

      - name: Comment and close
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE_NUMBER"

      - name: Comment the error
        if: steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/comment.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          else
            gh issue comment "$ISSUE_NUMBER" --body "反映できませんでした。ワークフローの実行に失敗しました。Issue は開いたままです。"
          fi

      - name: Fail when the input was invalid
        if: steps.apply.outcome == 'failure'
        run: exit 1
