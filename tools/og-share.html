<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
:root{--ink:#1a1614;--pink:#ffc2d4;--mint:#b9f5d0;--lav:#cfc6ff;--yel:#ffe45c}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6efe6;background-image:radial-gradient(#1a161422 2px,transparent 2px);background-size:28px 28px;font-family:Outfit,"Zen Maru Gothic",sans-serif;color:var(--ink);position:relative}
.card{position:absolute;left:70px;top:100px;width:690px;padding:44px 52px 40px;background:#fff;border:5px solid var(--ink);border-radius:32px;box-shadow:12px 12px 0 var(--ink)}
h1{margin:0;font-size:92px;line-height:.98;font-weight:800;letter-spacing:.005em}
.tags{display:flex;gap:16px;margin-top:30px}
.tag{font-family:"Zen Maru Gothic";font-weight:700;font-size:30px;padding:6px 26px;border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink)}
svg{position:absolute;overflow:visible}
</style></head><body>
