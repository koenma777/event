<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
:root{--ink:#1a1614;--pink:#ffc2d4;--mint:#b9f5d0;--lav:#cfc6ff;--yel:#ffe45c}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6efe6;background-image:radial-gradient(#1a161422 2px,transparent 2px);background-size:28px 28px;font-family:Outfit,"Zen Maru Gothic",sans-serif;color:var(--ink);position:relative}
.card{position:absolute;left:70px;top:100px;width:690px;padding:44px 52px 40px;background:#fff;border:5px solid var(--ink);border-radius:32px;box-shadow:12px 12px 0 var(--ink)}
h1{margin:0;font-size:92px;line-height:.98;font-weight:800;letter-spacing:.005em}
.tags{display:flex;gap:16px;margin-top:30px}
.tag{font-family:"Zen Maru Gothic";font-weight:700;font-size:30px;padding:6px 26px;border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink)}
svg{position:absolute;overflow:visible}
</style></head><body>
<!-- sparkle top-left -->
<svg style="left:40px;top:28px" width="80" height="90" viewBox="0 0 90 90"><path d="M45 4 C50 34 56 40 86 45 C56 50 50 56 45 86 C40 56 34 50 4 45 C34 40 40 34 45 4Z" fill="var(--yel)" stroke="#1a1614" stroke-width="5" stroke-linejoin="round"/></svg>
<!-- calendar -->
<svg style="left:840px;top:58px" width="250" height="250" viewBox="0 0 250 250">
 <rect x="22" y="40" width="200" height="190" rx="26" fill="#1a1614"/>
 <rect x="10" y="28" width="200" height="190" rx="26" fill="#fff" stroke="#1a1614" stroke-width="6"/>
 <path d="M10 54 a26 26 0 0 1 26-26 h148 a26 26 0 0 1 26 26 v26 h-200z" fill="var(--pink)" stroke="#1a1614" stroke-width="6" stroke-linejoin="round"/>
 <rect x="52" y="8" width="16" height="42" rx="8" fill="#fff" stroke="#1a1614" stroke-width="6"/>
 <rect x="152" y="8" width="16" height="42" rx="8" fill="#fff" stroke="#1a1614" stroke-width="6"/>
 <g fill="#1a1614"><circle cx="50" cy="114" r="9"/><circle cx="90" cy="114" r="9"/><circle cx="130" cy="114" r="9"/><circle cx="170" cy="114" r="9"/><circle cx="50" cy="152" r="9"/><circle cx="90" cy="152" r="9"/><circle cx="170" cy="152" r="9"/><circle cx="50" cy="190" r="9"/><circle cx="90" cy="190" r="9"/><circle cx="130" cy="190" r="9"/></g>
 <circle cx="130" cy="152" r="22" fill="var(--yel)" stroke="#1a1614" stroke-width="6"/>
</svg>
<!-- ticket -->
<svg style="left:790px;top:410px" width="300" height="170" viewBox="0 0 300 170">
 <g transform="rotate(-10 150 85)">
 <path d="M30 40 h240 v30 a16 16 0 0 0 0 32 v30 h-240 v-30 a16 16 0 0 0 0-32z" transform="translate(10 10)" fill="#1a1614"/>
 <path d="M30 40 h240 v30 a16 16 0 0 0 0 32 v30 h-240 v-30 a16 16 0 0 0 0-32z" fill="var(--mint)" stroke="#1a1614" stroke-width="6" stroke-linejoin="round"/>
 <line x1="205" y1="48" x2="205" y2="124" stroke="#1a1614" stroke-width="5" stroke-dasharray="10 9"/>
 <path d="M118 62 l9 18 20 3 -14 14 3 20 -18-9 -18 9 3-20 -14-14 20-3z" fill="var(--yel)" stroke="#1a1614" stroke-width="5" stroke-linejoin="round"/>
 </g>
</svg>
<!-- speech bubble -->
<svg style="left:1050px;top:300px" width="130" height="110" viewBox="0 0 130 110">
 <path d="M16 8 h96 a12 12 0 0 1 12 12 v48 a12 12 0 0 1 -12 12 h-54 l-26 22 4-22 h-20 a12 12 0 0 1 -12-12 v-48 a12 12 0 0 1 12-12z" fill="var(--lav)" stroke="#1a1614" stroke-width="5" stroke-linejoin="round"/>
 <g fill="#1a1614"><circle cx="40" cy="44" r="6"/><circle cx="64" cy="44" r="6"/><circle cx="88" cy="44" r="6"/></g>
</svg>
<!-- small sparkles -->
<svg style="left:1125px;top:560px" width="50" height="50" viewBox="0 0 90 90"><path d="M45 4 C50 34 56 40 86 45 C56 50 50 56 45 86 C40 56 34 50 4 45 C34 40 40 34 45 4Z" fill="var(--pink)" stroke="#1a1614" stroke-width="7" stroke-linejoin="round"/></svg>
<svg style="left:1135px;top:200px" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="16" fill="var(--lav)" stroke="#1a1614" stroke-width="5"/></svg>
<div class="card">
 <h1>KENSEI<br>HIRANO's<br>EVENTS</h1>
 <div class="tags"><span class="tag" style="background:var(--mint)">参加</span><span class="tag" style="background:var(--pink)">主催</span><span class="tag" style="background:var(--lav)">紹介</span></div>
</div>
</body></html>
