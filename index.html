<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f0ea">
  <meta name="description" content="平野賢正が参加・主催・紹介するイベント">
  <title>平野賢正</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f3f0ea'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%238a3d22'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>平野賢正</h1>
      <p class="city">下関</p>
    </header>
    <main>
      <noscript><p class="error">イベントの表示には JavaScript が必要です。</p></noscript>
      <section aria-labelledby="upcoming-title">
        <h2 id="upcoming-title">これから</h2>
        <ul id="upcoming" class="list"></ul>
        <p id="upcoming-empty" class="empty" hidden>ありません</p>
      </section>
      <section aria-labelledby="past-title">
        <h2 id="past-title">これまで</h2>
        <ul id="past" class="list"></ul>
        <p id="past-empty" class="empty" hidden>ありません</p>
      </section>
    </main>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
